name: Fetch Gordon Bennett Tracks

# Déclenchement manuel uniquement : les endpoints YB Tracking ne sont pas
# documentés et peuvent changer d'une édition à l'autre. Une fois qu'un run
# manuel passe pour le slug de la course, décommenter le cron ci-dessous.
on:
  workflow_dispatch:
    inputs:
      race:
        description: "Slug de la course chez YB (ex. gb2026, gb2024)"
        required: false
        default: "gb2026"
  # schedule:
  #   - cron: "*/15 * * * *"

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch tracks
        run: node fetch-gb.js "${{ github.event.inputs.race || 'gb2026' }}"

      - name: Commit snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gb.json
          git diff --staged --quiet && echo "Rien à committer" && exit 0
          git commit -m "chore: update Gordon Bennett tracks $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin master
          git push
