<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WindStats — Gordon Bennett : trace par altitude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #090c12;
      --bg2:       #0f1420;
      --bg3:       #161c2d;
      --border:    rgba(255,255,255,0.07);
      --text:      #c8d0e0;
      --text-dim:  rgba(200,208,224,0.45);
      --accent:    #38bdf8;
    }

    html { font-size: 15px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Mono", monospace;
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────────────────────── */
    header {
      padding: 1.6rem 2rem 1.2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo {
      font-family: "Syne", sans-serif;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
      color: #fff;
      text-decoration: none;
    }

    .logo span { color: var(--accent); }

    .tagline {
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    header .src {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    header .src a { color: var(--accent); text-decoration: none; }
    header .src a:hover { text-decoration: underline; }

    /* ── Layout ───────────────────────────────────────────────── */
    main {
      max-width: 1500px;
      margin: 0 auto;
      padding: 1.2rem 1.2rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .gb-status {
      font-size: 0.76rem;
      padding: 0.6rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg2);
      line-height: 1.5;
    }
    .gb-status.ok   { border-color: rgba(74,222,128,0.25);  background: rgba(74,222,128,0.06); }
    .gb-status.warn { border-color: rgba(251,146,60,0.25);  background: rgba(251,146,60,0.06); }
    .gb-status.err  { border-color: rgba(248,113,113,0.28); background: rgba(248,113,113,0.07); }
    .gb-status code {
      background: rgba(255,255,255,0.07);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 0.92em;
    }

    .gb-cols {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 1rem;
      align-items: start;
    }

    .panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel-title {
      font-family: "Syne", sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.75rem 1rem;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .panel-title .hint {
      margin-left: auto;
      font-family: "DM Mono", monospace;
      font-size: 0.66rem;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: var(--text-dim);
    }

    /* ── Carte ────────────────────────────────────────────────── */
    #gb-wrap { position: relative; }
    #gb-wrap.dragging::after {
      content: "Déposer les fichiers GPX / IGC / KML / GeoJSON";
      position: absolute; inset: 0; z-index: 1200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(9,12,18,0.85);
      border: 2px dashed var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-size: 0.85rem;
    }

    #gb-map {
      height: min(66vh, 640px);
      min-height: 380px;
      background: #0b0e15;
    }

    .leaflet-container { font-family: "DM Mono", monospace; background: #0b0e15; }
    .leaflet-control-attribution {
      background: rgba(9,12,18,0.75) !important;
      color: var(--text-dim) !important;
      font-size: 0.62rem !important;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }
    .leaflet-bar a {
      background: var(--bg3); color: var(--text);
      border-bottom-color: var(--border);
    }
    .leaflet-bar a:hover { background: #1e2740; color: #fff; }

    #gb-tooltip {
      position: absolute;
      z-index: 1000;
      display: none;
      pointer-events: none;
      background: rgba(9,12,18,0.94);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.7rem;
      font-size: 0.7rem;
      line-height: 1.45;
      min-width: 165px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .gb-tip-name { font-family: "Syne", sans-serif; font-weight: 600; color: #fff; font-size: 0.78rem; }
    .gb-tip-alt  { font-size: 0.95rem; font-weight: 500; margin: 2px 0 3px; }
    .gb-tip-line { color: var(--text-dim); }

    /* ── Légende altitude ─────────────────────────────────────── */
    .gb-legend { padding: 0.9rem 1rem 1rem; }

    #gb-legend-bar {
      height: 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
    }

    #gb-legend-ticks {
      display: flex;
      justify-content: space-between;
      margin-top: 0.35rem;
      font-size: 0.66rem;
      color: var(--text-dim);
    }

    .gb-legend-unit {
      font-size: 0.66rem;
      color: var(--text-dim);
      margin-top: 0.5rem;
    }

    .gb-scale-ctl {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      font-size: 0.7rem;
      color: var(--text-dim);
      flex-wrap: wrap;
    }

    .gb-scale-ctl label { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }

    .gb-scale-ctl input[type="number"] {
      width: 66px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: "DM Mono", monospace;
      font-size: 0.7rem;
      padding: 3px 5px;
    }
    .gb-scale-ctl input[type="number"]:disabled { opacity: 0.4; }

    /* ── Liste des traces ─────────────────────────────────────── */
    #gb-list { max-height: 340px; overflow-y: auto; }

    .gb-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer;
    }
    .gb-row:hover { background: rgba(255,255,255,0.03); }
    .gb-row.focus { background: rgba(56,189,248,0.09); border-left: 2px solid var(--accent); padding-left: calc(0.9rem - 2px); }

    .gb-row-main { flex: 1; min-width: 0; }
    .gb-row-name {
      font-family: "Syne", sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gb-row-sub { font-size: 0.64rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .gb-row-stats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      font-size: 0.64rem;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .gb-check { accent-color: var(--accent); cursor: pointer; }

    .gb-empty { padding: 1.2rem 1rem; font-size: 0.74rem; color: var(--text-dim); line-height: 1.6; }

    /* ── Profil ───────────────────────────────────────────────── */
    #gb-profile { width: 100%; height: 170px; display: block; }
    .gb-profile-box { padding: 0.6rem 0.8rem 0.8rem; }

    /* ── Boutons ──────────────────────────────────────────────── */
    .gb-actions {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .gb-btn {
      font-family: "DM Mono", monospace;
      font-size: 0.7rem;
      color: var(--text);
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
    }
    .gb-btn:hover { background: #1e2740; color: #fff; border-color: rgba(255,255,255,0.16); }
    #gb-file { display: none; }

    @media (max-width: 1000px) {
      .gb-cols { grid-template-columns: minmax(0, 1fr); }
      #gb-map { height: 52vh; }
      header { padding: 1.2rem 1rem; }
      header .src { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <a class="logo" href="index.html">Wind<span>Stats</span></a>
  <div class="tagline">Gordon Bennett — trace colorée par altitude</div>
  <div class="src">
    données : <a href="https://live.gordonbennett.aero/" target="_blank" rel="noopener">live.gordonbennett.aero</a>
  </div>
</header>

<main>

  <div id="gb-status" class="gb-status">Chargement…</div>

  <div class="gb-cols">

    <!-- ── Carte ─────────────────────────────────────────────── -->
    <div class="panel" id="gb-wrap">
      <div id="gb-map"></div>
      <div id="gb-tooltip"></div>
    </div>

    <!-- ── Colonne droite ────────────────────────────────────── -->
    <div style="display:flex; flex-direction:column; gap:1rem;">

      <div class="panel">
        <div class="panel-title">Altitude</div>
        <div class="gb-legend">
          <div id="gb-legend-bar"></div>
          <div id="gb-legend-ticks"></div>
          <div class="gb-legend-unit">mètres — sombre = bas, clair = haut</div>

          <div class="gb-scale-ctl">
            <label><input type="checkbox" id="gb-alt-auto" checked> échelle auto</label>
            <input type="number" id="gb-alt-lo" step="100" disabled aria-label="Altitude minimale">
            <span>→</span>
            <input type="number" id="gb-alt-hi" step="100" disabled aria-label="Altitude maximale">
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Traces</div>
        <div id="gb-list"></div>
        <div class="gb-empty" id="gb-empty" hidden></div>
        <div class="gb-actions">
          <button class="gb-btn" id="gb-fit">Recadrer</button>
          <button class="gb-btn" onclick="document.getElementById('gb-file').click()">Importer un fichier…</button>
          <input type="file" id="gb-file" multiple accept=".gpx,.igc,.kml,.json,.geojson">
        </div>
      </div>

    </div>
  </div>

  <!-- ── Profil altimétrique ─────────────────────────────────── -->
  <div class="panel">
    <div class="panel-title">
      <span id="gb-profile-title">Profil altimétrique</span>
      <span class="hint" id="gb-profile-hint"></span>
    </div>
    <div class="gb-profile-box">
      <canvas id="gb-profile"></canvas>
    </div>
  </div>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="gb-app.js"></script>
</body>
</html>
